<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <!-- Pebbled glass relief: fractal noise lit from the top left, tiles seamlessly -->
  <filter id="pebble" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="3" seed="7" stitchTiles="stitch" result="noise"/>
    <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="2" diffuseConstant="1.1">
      <feDistantLight azimuth="235" elevation="52"/>
    </feDiffuseLighting>
  </filter>
  <rect width="420" height="420" filter="url(#pebble)"/>
</svg>
