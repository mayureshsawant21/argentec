<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Argentec</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: #f3f5f8; color: #0e1b2e; font: 400 1rem/1.6 Montserrat, Arial, sans-serif; text-align: center; }
    h1 { margin: 1.5rem 0 0.5rem; font: 600 clamp(2rem, 6vw, 3rem)/1.1 "Source Serif 4", Georgia, serif; }
    p { margin: 0 0 1.5rem; color: #5b6676; }
    a { display: inline-block; padding: 0.9rem 1.6rem; background: #194376; color: #fff; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; }
    a:hover { background: #0f2a4d; }
    svg { width: 64px; height: 64px; color: #194376; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M24 11 13 34h6l5-11 5 11h6z" fill="currentColor"/></svg>
    <h1 data-cms="h1-1">Page not found</h1>
    <p data-cms="p-1">The page you are looking for has moved or no longer exists.</p>
    <a href="/" id="home">Go to the home page</a>
  </main>
  <script>
    // GitHub Pages serves the site from /argentec/; send visitors to that home page
    if (location.hostname.endsWith("github.io")) document.getElementById("home").href = "/" + location.pathname.split("/")[1] + "/";
  </script>
</body>
</html>
